- id: GLB-012
  name: Scope Creep - Modifying Working Components During Debugging
  failure_type: behavioral
  root_cause_category: scope_creep_during_debugging
  description: When debugging a failing component alongside working components, agent
    modified the working component and rewrote governance documents instead of isolating
    the broken component. MUST identify which specific component fails, MUST use the
    working component as a template, MUST only change the failing component content
    (SQL, fields), MUST NEVER modify a file the user says is working.
  escalation_level: 1
  current_mitigation: advisory
  mitigation_target: C:\Users\jmolina\.gemini\config\pattern-library.yaml
  occurrences:
  - session: conversation://7ce4bb58-cddd-46b6-8aa1-8b93d7ac3d30
