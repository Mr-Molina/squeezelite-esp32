- id: GLB-011
  name: Staged Deployment & Manual Upload Gate
  failure_type: behavioral
  root_cause_category: premature_device_restart
  description: When deploying hardware configurations requiring external/manual staging
    (FTP, TFTP, file servers), the agent MUST NOT trigger device reboots in the same
    execution loop as file generation. File staging and reboot MUST be decoupled,
    and the agent MUST halt to allow the user to complete and verify the upload before
    issuing restart commands.
  escalation_level: 2
  current_mitigation: mechanical_invariant — C:\Users\jmolina\.gemini\config\rules\staging-before-restart.md
