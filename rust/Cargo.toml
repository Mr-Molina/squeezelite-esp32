[workspace]
members = [
    "crates/squeezelite-proto",
    "crates/squeezelite-audio-core",
    "crates/squeezelite-tas58xx",
    "crates/squeezelite-decoders",
    "crates/squeezelite-cyd-link",
    "crates/squeezelite-config",
    "crates/louder-esp32-app",
    "crates/cyd-controller-app",
    "crates/squeezelite-raop",
    "crates/squeezelite-cspot",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Squeezelite-ESP32 Team"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
heapless = "0.8"
embedded-hal = "1.0"
embedded-io = "0.6"
thiserror = { version = "1.0", default-features = false }
log = { version = "0.4", default-features = false }
proptest = "1.5"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
borrowed_box = "deny"
ptr_arg = "deny"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"

[patch.crates-io]
nanomp3-core = { path = "crates/nanomp3-core" }
esp-radio = { path = "vendor/esp-radio" }
syom = { path = "vendor/syom" }
lewton = { path = "vendor/lewton" }
alac = { path = "vendor/alac" }
opus-rs = { path = "vendor/opus-rs" }

