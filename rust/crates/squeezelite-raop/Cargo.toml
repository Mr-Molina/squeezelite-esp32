[package]
name = "squeezelite-raop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure-Rust #![no_std] AirPlay 1 (RAOP) receiver engine for squeezelite-esp32"

[features]
